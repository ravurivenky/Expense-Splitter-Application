<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splitter App</title>
  <link href="/src/index.css" rel="stylesheet" />
  <!--toast related links(CSS & JS)-->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script async type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script defer type="module" src="/src/main.js"></script>
</head>

<body class="min-h-screen gradient-bg">
  <div class="mx-auto p-4 max-w-7xl md:p-6 lg:p-8">
    <!--header-->
    <header class="flex flex-col justify-between items-center mb-12 md:flex-row">
      <div class="text-center mb-6 md:text-left md:mb-0">
        <h1 class="text-6xl font-bold tracking-tight text-white mb-2 md:text-7xl">
          <span class="inline-block">💸</span>Splitter
        </h1>
        <p class="text-xl text-purple-100 font-light">Split expenses with friends.</p>
      </div>
      <nav class="flex gap-3">
        <button
          class="btn-hover bg-yellow-300 hover:bg-yellow-400 text-white px-6 py-3 rounded-xl font-semibold shadow-lg cursor-pointer" id="btnExport">Export JSON</button>
        <div class="flex gap-3">

    <!-- Import JSON -->
    <label class="bg-blue-300 hover:bg-blue-400 text-white flex items-center justify-center text-center px-4 py-2 rounded-lg cursor-pointer">
        Import JSON

        <input id="importJsonFile"
            type="file"
            accept=".json,application/json"
            class="hidden"
            >
    </label>

</div>
      </nav>
    </header>

    <!--add user & expense-->
    <div class="grid grid-cols-1 gap-8 mb-8 lg:grid-cols-2">
      <!--add user form-->
      <form id="addUserForm" class="p-8 rounded-2xl card-shadow glass-effect">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">Add Users</h2>
        <div class="space-y-2">
          <input type="text" id="txtUser" placeholder="User Name"
            class="w-full border-2 border-gray-200 p-4 rounded-xl text-lg outline-none focus:border-blue-500">
          <button type="submit"
            class="w-full bg-blue-500 hover:bg-blue-600 text-white px-6 py-4 rounded-xl font-semibold text-lg shadow-lg">Add
            User</button>
            <p id="displayUsers" class="text-gray-700 font-semibold"></p>
        </div>
      </form>
      <!--add expenses form-->
      <form id="addExpenseForm" class="p-8 rounded-2xl card-shadow glass-effect">
        <h2 class="text-3xl font-bold text-gray-800 mb-4">Add Expenses</h2>
        <div class="space-y-2">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Who Paid?</label>
              <select id="expenseUserInput"
                class="w-full border-2 border-gray-200 focus:border-green-500 p-4 rounded-xl text-lg outline-none bg-white"></select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Amount (₹)</label>
              <input type="number" id="txtExpenseAmount" placeholder="eg: 100.0" min="0" step="0.01"
                class="w-full border-2 border-gray-200 p-4 rounded-xl text-lg outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
              <input type="text" id="txtExpenseDescription" placeholder="eg: Snacks, Ice Cream"
                class="w-full border-2 border-gray-200 p-4 rounded-xl text-lg outline-none focus:border-blue-500">
            </div>
          </div>
          <button type="submit"
            class="w-full bg-blue-500 hover:bg-blue-600 text-white px-6 py-4 rounded-xl font-semibold text-lg shadow-lg">Add
            Expenses</button>
        </div>
      </form>
    </div>

    <!--expenses overview-->
    <div id="renderExpense" class="glass-effect p-8 rounded-2xl card-shadow">
      <h2 class="text-3xl font-bold text-gray-800 mb-3">Expense Overview</h2>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!--All Payments-->
        <div class="lg:col-span-1">
          <h3 class="text-xl font-semibold text-gray-700 mb-1 flex item-center gap-2">All Payments</h3>
          <div class="mb-3">
            <p id="AmountsSpan" class="text-gray-700 font-semibold"></p>
          </div>
          <div class="bg-gray-100 border-2 border-gray-300 p-4 rounded-xl h-80 overflow-y-auto scroll-area">
            <ul class="space-y-2" id="paymentList"></ul>
          </div>
        </div>
        <!--Split Expenses button-->
        <div class="lg:col-span-1 flex items-center justify-center">
          <button id="splitfyBtn"
            class="btn-hover pulse-glow bg-purple-500 hover:bg-purple-600 text-white px-8 py-6 rounded-2xl font-bold text-xl shadow-2xl">Split
            It!</button>
        </div>
        <!--Settlements-->
        <div class="lg:col-span-1">
          <h3 class="text-xl font-semibold text-gray-700 mb-4 flex item-center gap-2">Who Owns Whom</h3>
          <div
            class="bg-gradient-to-br from-amber-50 to-yellow-50 border-2 border-amber-200 p-4 rounded-xl h-80 overflow-y-auto scroll-area">
            <ul class="space-y-2" id="resultArea"></ul>
          </div>
        </div>
      </div>
    </div>

    <!--footer-->
    <footer class="text-center mt-12 text-purple-100">
      <p class="text-lg font-light">Splitting Expenses fairly.</p>
    </footer>
  </div>
</body>

</html>
